<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- Garante que o site fique bom no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">9º Ano — Estudante Exemplo</p>
  </header>

  <main class="conteudo">

    <!-- CARDS DE RESUMO -->
    <section class="cards">
      <div class="card">
        <span class="card-titulo">Média geral</span>
        <span class="card-valor" id="card-media-geral">—</span>
      </div>

      <div class="card">
        <span class="card-titulo">Total de faltas</span>
        <span class="card-valor" id="card-total-faltas">—</span>
      </div>

      <div class="card">
        <span class="card-titulo">Bom desempenho</span>
        <span class="card-valor" id="card-bom-desempenho">—</span>
      </div>

      <div class="card">
        <span class="card-titulo">Precisam de atenção</span>
        <span class="card-valor" id="card-atencao">—</span>
      </div>

      <div class="card">
        <span class="card-titulo">Frequência</span>
        <span class="card-valor" id="card-frequencia">—</span>
        <span class="card-extra" id="card-frequencia-texto"></span>
      </div>
    </section>

    <!-- TABELA DE DISCIPLINAS -->
    <section class="tabela-area">
      <h2>Notas por disciplina</h2>

      <!-- O wrapper permite rolagem horizontal no celular -->
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <!-- As linhas serão criadas pelo JavaScript -->
          <tbody id="corpo-tabela"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
